# Exceptions to the 1,000-line limit on tracked .py and .sh files.
# Each row is a table named by the file's quoted path. Its fields:
#   ceiling  the file's exact physical line count (newline characters), over 1,000
#   verdict  "split pending" or "structural exception"
#   seam     split pending only: the seam along which the file splits
#   issue    split pending only, optional: the issue that owns the split
#   reason   structural exception only: why the file cannot be split
#
# Choosing a verdict:
#   split pending         parts can move out without changing how the file is loaded, invoked or installed
#   structural exception  every seam would change how the file is loaded, invoked or installed, so the file stays whole
#
# This table is the split backlog. Rank split-pending rows by exposure (physical lines times 90-day commits);
# the recipe is in docs/design-decisions/code-file-line-limit.md.
#
# Layout rule: copy the layout of the neighbouring rows, and run test_exception_table_shape in
# claude/.claude/tests/test_code_file_size.py. It prints the canonical form's rules and the diff to apply when this file departs from them.
#
# Conflict rule: resolve a merge conflict in this order.
#   1. Resolve the conflicts in code files first.
#   2. In this table, keep every row and every field change from both sides.
#   3. Insert added rows in sorted order.
#   4. Where both sides changed one row's ceiling, keep either value.
#   5. Run the check and write the values it prints.
#
# Split rule: each new part of a split returns from one default Read call with no PARTIAL view notice.
# A part that does not is split further, or the PR says why not.
#
# The check is claude/.claude/tests/test_code_file_size.py and the decision record is docs/design-decisions/code-file-line-limit.md.
