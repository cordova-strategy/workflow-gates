# WARNING: The job id ("tests") is the status check context string
# referenced by branch protection on main. Renaming the job silently breaks
# the required-check match. If you rename the job, also update the
# required_status_checks.contexts list via:
#   gh api -X PUT repos/cordova-strategy/workflow-gates/branches/main/protection
# A job-level "name:", when set, replaces the id as the context string, so the "tests" job carries none.
# The workflow-level "name:" does not affect the context string.
# The "tests" job is the aggregate at the end of this file, and passes only when every test-slice leg succeeds.

name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  # A push-to-main run that has started is not cancelled by a newer push, because the `tests` aggregate would report a cancelled run as failed.
  # A run still waiting in the group can be replaced by a newer push, and a replaced run never runs the `tests` aggregate.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test-slice:
    runs-on: ubuntu-24.04
    strategy:
      # A failing leg must not cancel the other, so both passes report.
      fail-fast: false
      matrix:
        slice: [parallel, timing]
    # Each leg runs one pytest pass (see the "Run tests" steps below): the
    # parallel leg runs a pass under -n auto covering everything not marked
    # `timing`, and the timing leg runs a serial (-n0) pass covering only the
    # wall-clock-sensitive `timing` tests, which would flake under
    # sibling-worker load. The parallel leg dominates. It includes the
    # repo-wide lint in claude/.claude/hooks/tests/test_shellcheck.py, which
    # runs one shellcheck process over every discovered file, so more xdist
    # workers cannot shorten it. Re-derive this cap whenever the parallel
    # pass grows.
    timeout-minutes: 30
    env:
      # Dial CI parallelism from the repo Variables settings page (e.g.
      # during a flake incident) without a PR. Unset/empty falls through to
      # xdist's own auto-detection (psutil physical-core count if psutil is
      # importable, else os.cpu_count() logical cores).
      PYTEST_XDIST_AUTO_NUM_WORKERS: ${{ vars.PYTEST_XDIST_AUTO_NUM_WORKERS }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Detect which checks the diff needs
        id: detect
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
            HEAD="${{ github.event.pull_request.head.sha }}"
          else
            BASE="${{ github.event.before }}"
            HEAD="${{ github.sha }}"
          fi

          # Fail open: if BASE is the zero SHA (first push, some force-push
          # scenarios) or unresolvable locally, run the test suite.
          ZERO_SHA="0000000000000000000000000000000000000000"
          if [ "$BASE" = "$ZERO_SHA" ] || ! git cat-file -e "$BASE" 2>/dev/null; then
            echo "BASE unresolvable ($BASE); running tests."
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          CHANGED=$(git diff --name-only "$BASE" "$HEAD")

          # Deny-list of paths confirmed unread by any test module. Everything
          # else defaults to running the suite, so a new test-input path never
          # needs this list updated to be covered — only a path added here
          # needs the "confirmed unread by any test" check re-run.
          SKIP_REGEX='^(LICENSE$|CHANGELOG\.md$|CODE_OF_CONDUCT\.md$|SECURITY\.md$|CONTRIBUTING\.md$)'

          SKIPPED=$(echo "$CHANGED" | grep -E "$SKIP_REGEX" || true)
          NOT_SKIPPED=$(echo "$CHANGED" | grep -vE "$SKIP_REGEX" || true)

          if [ -n "$SKIPPED" ]; then
            echo "Skipped (deny-listed):"; echo "$SKIPPED" | sed 's/^/  /'
          else
            echo "Skipped (deny-listed): (none)"
          fi
          if [ -n "$NOT_SKIPPED" ]; then
            echo "Not skipped (will run tests):"; echo "$NOT_SKIPPED" | sed 's/^/  /'
          else
            echo "Not skipped (will run tests): (none)"
          fi

          if [ -n "$NOT_SKIPPED" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Skip — no test-relevant changes
        if: steps.detect.outputs.changed != 'true'
        run: echo "No test-relevant files changed; skipping pytest and ruff."

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        if: steps.detect.outputs.changed == 'true'
        with:
          # This pin sets the Python minor.
          # install-dev.sh, test_ci_python_matches_dev_interpreter.py and test_python_floor.py read it.
          # test_python_floor.py fails when _config.sh's floor, README.md's floor or ruff's target-version differs from it.
          python-version: '3.14'

      - name: Install dependencies
        if: steps.detect.outputs.changed == 'true'
        run: pip install -r requirements-dev.txt

      # test_relocate_claude_config.py exercises real stow/stow -D (not a
      # stub) — a fake stow would let a wrong working directory or -t/-d
      # targeting pass silently, which is exactly what that script's
      # correctness depends on. Likewise, test_ci_watch.py's real-direnv
      # tests exercise actual direnv hook output, not a stub, so direnv
      # must be a real binary too.
      - name: Install stow and direnv
        # Each "Run tests" step's `if:` below must stay this condition plus its own `matrix.slice` test, because conftest.py's require_direnv() hard-fail guarantee depends on it.
        if: steps.detect.outputs.changed == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y stow direnv
          direnv --version

      # Several tests skip when jq is not on PATH, the `requires_jq` marker among them, so a runner image without jq would pass CI with those tests skipped.
      # This step fails the job in that case.
      - name: Require jq
        if: steps.detect.outputs.changed == 'true'
        run: jq --version

      # The pin is one Ubuntu 24.04 (noble) build version of git and git-man, installed by name from the runner's apt sources, which apt verifies against the signed index.
      # When Ubuntu supersedes the build, the install fails with a "Version ... was not found" error, and that failure is the signal to bump.
      # test_ci_git_equals_the_floor fails when the test steps run without this step.
      # To bump, take the newest noble-updates or noble-security build of git and git-man in the apt-cache policy table a failing run prints, and change the version in one PR. packages.ubuntu.com can list a build the runner's mirror does not carry yet.
      # The upstream version must keep the floor's major.minor, because test_git_floor.py ties the version to install.sh's GIT_MINIMUM_VERSION.
      - name: Install the pinned git package
        id: pin-git
        if: steps.detect.outputs.changed == 'true'
        env:
          CI_GIT_PACKAGE_VERSION: "1:2.43.0-1ubuntu7.4"
        run: |
          set -euo pipefail
          : "${CI_GIT_PACKAGE_VERSION:?}"

          # The earlier plain apt-get update exits 0 after a transient fetch error, so a source's list can stay stale.
          # --error-on=any fails this step on such an error instead, because a stale list would show up as a false "not found".
          sudo apt-get update --error-on=any

          echo "The image's git, and the apt sources and candidates for git and git-man:"
          git --version
          apt-cache policy git git-man

          if ! sudo apt-get install -y --no-remove --allow-downgrades "git=$CI_GIT_PACKAGE_VERSION" "git-man=$CI_GIT_PACKAGE_VERSION"; then
            {
              echo "apt could not install git and git-man $CI_GIT_PACKAGE_VERSION."
              echo "Read apt's error above and the apt-cache policy table printed earlier; if the error is a 'Version ... was not found' one, bump the pin as the comment above this step says."
            } >&2
            exit 1
          fi
          sudo apt-mark hold git git-man
          git --version

      # The pin is one Ubuntu 24.04 (noble) release-pocket build of zsh and zsh-common, installed by name from the runner's apt sources, which apt verifies against the signed index.
      # The tests need a real zsh, and the pin buys a reproducible build and nothing the tests check.
      # A release-pocket pin takes no later security build.
      # To bump, take the build from the apt-cache policy table a failing run prints. packages.ubuntu.com can list a build the runner's mirror does not carry yet.
      # require_zsh() fails CI only where no zsh is on the runner, so it does not show whether this step ran.
      # The step runs in the parallel leg only, because the timing leg runs no row that needs zsh.
      - name: Install the pinned zsh package
        id: pin-zsh
        if: steps.detect.outputs.changed == 'true' && matrix.slice == 'parallel'
        env:
          CI_ZSH_PACKAGE_VERSION: "5.9-6ubuntu2"
        run: |
          set -euo pipefail
          : "${CI_ZSH_PACKAGE_VERSION:?}"

          # This step runs its own update, so it stays correct if the pin-git step moves or goes.
          # --error-on=any fails this step on a transient fetch error instead of letting a stale list show up as a false "not found".
          sudo apt-get update --error-on=any

          echo "The apt sources and candidates for zsh and zsh-common:"
          apt-cache policy zsh zsh-common

          if ! sudo apt-get install -y --no-remove --allow-downgrades "zsh=$CI_ZSH_PACKAGE_VERSION" "zsh-common=$CI_ZSH_PACKAGE_VERSION"; then
            {
              echo "apt could not install zsh and zsh-common $CI_ZSH_PACKAGE_VERSION."
              echo "Read apt's error above and the apt-cache policy table printed earlier. If the error is a fetch error, re-run the job first; if it is a 'Version ... was not found' one, bump the pin as the comment above this step says."
            } >&2
            exit 1
          fi
          sudo apt-mark hold zsh zsh-common
          zsh --version

      # The pin is the shfmt linux amd64 release asset at the floor's version, installed only after its SHA-256 matches the digest below, and checked against the digest again once installed.
      # The step runs in both legs, unlike the zsh step, because a `timing` case that parses with shfmt must then find the pinned build, as a parallel-leg case does. The cost is one download per leg.
      # The digest was computed locally by hashing the release's linux amd64 asset with `shasum -a 256`, and it equals the attested release digest.
      # What each source proves for v3.14.0, one per item:
      # - The release carries no checksum file asset.
      # - Its GitHub release attestation verifies and lists the pinned digest. That shows the asset is the one the release published, and its root of trust is GitHub.
      # - It carries no build-provenance attestation, so nothing ties the binary to a source build.
      # - A Go checksum database match proves the tag's source and not the binary, so it is never a comparison for this digest. A source build would prove the tag's source, which the release attestation does not.
      # The binary's build is unproven, because nothing stronger held at the pin.
      # To bump:
      # 1. Run `gh release verify` and `gh attestation verify` again on the new release.
      # 2. Change the version and digest together.
      # 3. Update any install.sh message that names this version.
      # 4. Move any shfmt floor that names it, in the same change.
      # test_ci_shfmt_equals_the_pin fails when the test steps run without this step.
      - name: Install the pinned shfmt binary
        id: pin-shfmt
        if: steps.detect.outputs.changed == 'true'
        env:
          CI_SHFMT_VERSION: "3.14.0"
          CI_SHFMT_SHA256: "fe42021c7272ef2d67ea36cbc3031683c625d0badec733ef3a57b567246a0b66"
        run: |
          set -euo pipefail
          : "${CI_SHFMT_VERSION:?}"
          : "${CI_SHFMT_SHA256:?}"

          asset="shfmt_v${CI_SHFMT_VERSION}_linux_amd64"
          url="https://github.com/mvdan/sh/releases/download/v${CI_SHFMT_VERSION}/${asset}"
          download_dir="$(mktemp -d)"
          # CI_SHFMT_INSTALL_DIR is a test-only seam: the step's test sets it to a stub directory, and no workflow, job or step env sets it, so the runner installs into /usr/local/bin.
          install_dir="${CI_SHFMT_INSTALL_DIR:-/usr/local/bin}"

          # The curl manual's --retry entry (curl 8.23.0) says curl retries a timeout, an FTP 4xx response code and an HTTP 408, 429, 500, 502, 503, 504, 522 or 524 response code, and an older curl lists fewer.
          # A refused or reset connection and a TLS failure are not on that list, so they fail at once. No vendor value applies to the retry count.
          fetch_retries=3
          # The curl manual's --retry-max-time entry says the retry timer starts before the first attempt and no retry starts once it reaches this many seconds, and an attempt already running may outlast it. No vendor value applies.
          # It must exceed fetch_attempt_max_seconds, or an attempt that --max-time ends leaves no retry.
          fetch_retry_max_seconds=180
          # The curl manual's --max-time entry says it bounds each transfer and its counter resets on each retry. No vendor value applies.
          fetch_attempt_max_seconds=60
          if ! curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' \
            --retry "$fetch_retries" --retry-max-time "$fetch_retry_max_seconds" --max-time "$fetch_attempt_max_seconds" \
            --output "${download_dir}/${asset}" "$url"; then
            {
              echo "The fetch of $url failed, so no digest was checked."
              echo "Read curl's error above. A 404 means the pinned version has no such asset, so bump the pin as the comment above this step says."
              echo "Any other failure is likely a transient fetch error, so re-run the job first."
            } >&2
            exit 1
          fi

          if ! (cd "$download_dir" && printf '%s  %s\n' "$CI_SHFMT_SHA256" "$asset" | sha256sum --check --strict -); then
            {
              echo "The SHA-256 of $asset does not match CI_SHFMT_SHA256, so the binary was not installed."
              echo "The digest is the in-repo pin the comment above this step describes. Check it against the asset before changing it."
            } >&2
            exit 1
          fi

          sudo install -m 0755 "${download_dir}/${asset}" "${install_dir}/shfmt"

          # The check above covers the downloaded file, so the installed file is checked too.
          if ! printf '%s  %s\n' "$CI_SHFMT_SHA256" "${install_dir}/shfmt" | sha256sum --check --strict -; then
            {
              echo "The SHA-256 of the installed ${install_dir}/shfmt does not match CI_SHFMT_SHA256, so the tests would not parse with the pinned build."
              echo "The file changed between the digest check and the install, or the install wrote other bytes."
            } >&2
            exit 1
          fi

          # A same-version shfmt earlier on PATH would otherwise stand in for the pinned bytes.
          resolved_shfmt="$(command -v shfmt || true)"
          if [ "$resolved_shfmt" != "${install_dir}/shfmt" ]; then
            {
              echo "shfmt resolves to '${resolved_shfmt:-none found}' on PATH, not the installed ${install_dir}/shfmt, so the tests would not parse with the pinned build."
              echo "The pin is this step's env and comment. Find which PATH entry holds the other shfmt."
            } >&2
            exit 1
          fi
          echo "shfmt resolved on PATH: $resolved_shfmt"
          shfmt --version

      - name: Report runner core count
        if: steps.detect.outputs.changed == 'true'
        run: nproc

      # Records the pinned git's version, the runner's bash and gh versions, and which awk implementation runs the cumulative-review normalizer's tests.
      # bash comes from the runner image and is not pinned, so its version identifies the build the real-bash cases in the shell-syntax-tree tests run on.
      # gh comes from the runner image and is not pinned, so its version identifies which release's `gh help` output the drift-guard tests in test_lib_tool_argv.py parse.
      - name: Report runner git, bash, gh and awk versions
        if: steps.detect.outputs.changed == 'true'
        run: |
          git --version
          bash --version | head -n 1
          gh --version || true
          readlink -f "$(command -v awk)" || true
          { awk --version || awk -W version || awk -version; } </dev/null 2>/dev/null | head -n 1 || true

      # locale_that_widens_ascii_ranges (helpers.py) fails CI when no installed UTF-8 locale lets a bracket range accept a non-ASCII letter.
      # locale_that_folds_ascii_capital_i_to_a_non_ascii_letter (helpers.py) fails CI when no installed UTF-8 locale lower-cases `I` to a non-ASCII letter, which tr_TR does.
      - name: Generate UTF-8 locales
        if: steps.detect.outputs.changed == 'true'
        run: sudo locale-gen en_US.UTF-8 tr_TR.UTF-8

      - name: Run tests (parallel)
        # This step's `if:` must keep the condition described in the "Install stow and direnv" step's comment.
        if: steps.detect.outputs.changed == 'true' && matrix.slice == 'parallel'
        run: pytest claude/.claude/ claude-skills/ plugins/ evals/ -v -m "not timing"

      # This step's `if:` must keep the condition described in the "Install stow and direnv" step's comment.
      - name: Run tests (timing, serial)
        if: steps.detect.outputs.changed == 'true' && matrix.slice == 'timing'
        run: pytest claude/.claude/ claude-skills/ plugins/ evals/ -v -m timing -n0

      # Runs in the timing leg only, so it reports once.
      - name: Lint
        if: steps.detect.outputs.changed == 'true' && matrix.slice == 'timing'
        run: ruff check claude/.claude/ claude-skills/ plugins/ evals/

  tests:
    needs: test-slice
    # always(), not !cancelled(): a cancelled run must fail this required check, not skip it.
    if: always()
    runs-on: ubuntu-24.04
    # Bounds a stuck runner for one shell comparison; no vendor value applies.
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Require every test-slice leg to succeed
        env:
          SLICE_RESULT: ${{ needs.test-slice.result }}
        run: |
          set -euo pipefail
          if [[ "$SLICE_RESULT" == "success" ]]; then
            exit 0
          fi
          echo "test-slice finished as '$SLICE_RESULT'; tests passes only when every leg succeeds." >&2
          exit 1
